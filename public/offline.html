<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>tradetrl — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #0b0d10;
        color: #eceef2;
        font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card { max-width: 22rem; }
      h1 { margin: 1.5rem 0 0; font: 400 28px/1.2 Georgia, 'Times New Roman', serif; }
      p { margin: 0.75rem 0 0; color: #a2a8b4; }
      button {
        margin-top: 1.75rem;
        height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 10px;
        background: #7c83f0;
        color: #08090b;
        font: 500 14px/1 inherit;
        cursor: pointer;
      }
      button:hover { background: #949af5; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 32 32" width="44" height="44" role="img" aria-label="tradetrl">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="#14161a" stroke="#2e323b" stroke-width="1.5" />
        <path d="M9 17.5 16 10l7 7.5" fill="none" stroke="#7c83f0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9.5 23h13" stroke="#464b55" stroke-width="2.2" stroke-linecap="round" />
      </svg>
      <h1>You're offline</h1>
      <p>
        Nothing has been lost — your journal is stored on your device and syncs
        the moment you're back.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
